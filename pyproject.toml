[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-recall"
version = "0.1.1"
description = "Deterministic markdown memory and knowledge graph for AI coding agents: BM25+wikilink retrieval over your notes, no vector database required. Ships a Claude Code hook as its first integration."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["memory", "retrieval", "bm25", "rag", "knowledge-graph", "wikilinks", "agent-memory", "mcp", "model-context-protocol", "hook", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dense = [
    "chromadb>=0.5.0",
    "ollama>=0.3.0",
]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/Abydin/atlas-recall"
Issues = "https://github.com/Abydin/atlas-recall/issues"

[project.scripts]
recall = "atlas_recall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
